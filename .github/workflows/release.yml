name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Needed so @semantic-release/git can push version bumps / tags
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          # Writes auth into .npmrc using NODE_AUTH_TOKEN
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required by actions/setup-node registry auth (.npmrc)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Required by @semantic-release/npm
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance works in GitHub Actions (OIDC); keep off for local publishes
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
